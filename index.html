<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Registration & Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
      margin: 0;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 350px;
    }
    input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #218838;
    }
    img {
      width: 100px;
      height: 100px;
      margin-bottom: 10px;
    }
    h2 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Section -->
    <img src="html.png" alt="Login Image">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="login()">Login</button>

    <!-- Registration Form (hidden until login is successful) -->
    <div id="formContainer" style="display:none;">
      <h2>Registration Details</h2>
      <form id="userForm">
        <input type="text" name="fullname" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="text" name="street" placeholder="Street Address" required>
        <input type="text" name="city" placeholder="City" required>
        <input type="text" name="state" placeholder="State/Province" required>
        <input type="text" name="zip" placeholder="ZIP/Postal Code" required>
        <input type="text" name="country" placeholder="Country" required>
        <input type="tel" name="phone" placeholder="Phone Number" required>
        <input type="password" name="regPassword" placeholder="Password" required>
        <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
        <button type="submit">Submit Registration</button>
      </form>
    </div>
  </div>

  <script>
    function login() {
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      // Simple validation: adjust logic as needed.
      if (username === "admin" && password === "password") {
        alert("Login Successful!");
        document.getElementById('formContainer').style.display = "block";
      } else {
        alert("Invalid Credentials");
      }
    }
    
    // Handle registration form submission
    document.getElementById('userForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent the form from submitting normally
      // Here you could add code to save the data via AJAX or similar methods
      
      // Redirect to the thank you page after saving the data
      window.location.href = 'thankyou.html';
    });
  </script>
</body>
</html>
